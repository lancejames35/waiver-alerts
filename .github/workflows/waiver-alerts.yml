name: waiver-alerts

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min; the script decides when digests are due (Central time)
  workflow_dispatch:
    inputs:
      force_digest:
        description: "Send the digest now"
        type: boolean
        default: false

concurrency:
  group: waiver-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: espn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: espn/state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_DIGEST: ${{ github.event.inputs.force_digest }}
        run: python waiver_alerts.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: espn/state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
